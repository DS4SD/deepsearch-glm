[project]
name = "deepsearch-glm"
version = "1.0.0"  # DO NOT EDIT, updated automatically
description = "Graph Language Models"
license = "MIT"
readme = "README.md"
authors = [
    {name = "Peter Staar", email = "taa@zurich.ibm.com"},
]
requires-python = ">=3.10"
dependencies = [
    "pywin32>=307,<400; sys_platform == 'win32'",
]

[project.optional-dependencies]
# MANUAL MAINTENANCE REQUIRED: for every change in the extras, "all" must be updated,
# namely as the union of all extras' direct dependencies.
pyplot = ["matplotlib>=3.7.1,<4.0.0"]
toolkit = [
    "deepsearch-toolkit>=1.1.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]
docling = [
    "docling-core>=2.0,<3.0",
    "pandas>=1.5.1,<3.0.0",
]
utils = [
    "tabulate>=0.8.9",
    "python-dotenv>=1.0.0,<2.0.0",
    "pandas>=1.5.1,<3.0.0",
    "tqdm>=4.64.0,<5.0.0",
    "rich>=13.7.0,<14.0.0",
    "requests>=2.32.3,<3.0.0",
]
all = [
    "deepsearch-toolkit>=1.1.0,<2.0.0",
    "docling-core>=2.0,<3.0",
    "matplotlib>=3.7.1,<4.0.0",
    "pandas>=1.5.1,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.32.3,<3.0.0",
    "rich>=13.7.0,<14.0.0",
    "tabulate>=0.8.9",
    "tqdm>=4.64.0,<5.0.0",
]

[dependency-groups]
test = [
    "pytest>=7.4.2,<8.0.0",
]
dev = [
    "docutils!=0.21",
    "mypy>=1.7.1,<2.0.0",
    "pre-commit==2.17.0",
    "python-semantic-release>=7.32.2,<8.0.0",
    "ruff>=0.11,<1.0",
]
build = [
    "cibuildwheel>=2.19.2,<3.0.0; python_version < '3.11'",
    "cibuildwheel>=2.19.2,<4.0.0; python_version >= '3.11'",
    "delocate>=0.11.0,<1.0.0",
    "pybind11>=2.13.1",
    "wheel>=0.43.0,<1.0.0",
]

[tool.uv]
package = true
default-groups = "all"
constraint-dependencies = [
    "numpy>=1.24.4,<3.0.0",
    "pandas>=1.5.1,<3.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["deepsearch_glm*"]

[tool.setuptools.package-data]
"deepsearch_glm" = [
    "*.so",
    "*.pyd",
    "*.dll",
    "resources/**/*",
]

[tool.setuptools.exclude-package-data]
"deepsearch_glm" = ["*.pyc", "__pycache__"]

[tool.ruff]
target-version = "py310"
line-length = 88
respect-gitignore = true

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "C",
    "C9",
    "E",
    "F",
    "I",
    "PIE",
    "Q",
    "RUF",
    "W",
    "ASYNC",
    "UP",
]
ignore = [
    "C408",
    "E501",
    "E722",
    "F401",
    "F811",
    "F841",
    "PL",
    "C405",
    "C414",
    "RUF012",
    "RUF059",
    "UP006",
    "UP007",
    "UP035",
    "W291",
    "W293",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"tests/*.py" = ["ASYNC", "E402"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
# plugins = ["pydantic.mypy"]
pretty = true
# strict = true
#no_implicit_optional = true
python_version = "3.10"
no_site_packages = true
disable_error_code = ["import-untyped", "import-not-found"]

#[[tool.mypy.overrides]]
#module = "deepsearch_glm.andromeda_nlp"
#ignore_errors = true

#[[tool.mypy.overrides]]
#module = "deepsearch_glm.andromeda_glm.*"
#ignore_errors = true

#[[tool.mypy.overrides]]
#module = "pandas.*"
#ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepsearch_glm.andromeda_nlp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepsearch_glm.andromeda_structs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepsearch_glm.andromeda_glm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tabulate.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[build-system]
requires = [
    "setuptools>=77.0.3",
    "pybind11>=2.13.1",
]
build-backend = "setuptools.build_meta"

[tool.semantic_release]
# for default values check:
# https://github.com/python-semantic-release/python-semantic-release/blob/v7.32.2/semantic_release/defaults.cfg

version_source = "tag_only"
branch = "main"

# configure types which should trigger minor and patch version bumps respectively
# (note that they must be a subset of the configured allowed types):
parser_angular_allowed_types = "build,chore,ci,docs,feat,fix,perf,style,refactor,test"
parser_angular_minor_types = "feat"
parser_angular_patch_types = "fix,perf"
